<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Area riservata — L'Orsetto Lavatore</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --schiuma:#F1F4F0; --blu-profondo:#173446; --blu-profondo-2:#0F2530;
    --blu-acqua:#4E88A6; --giallo:#F4B940; --inchiostro:#16232B; --grigio:#5C6B66; --bianco:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:var(--schiuma);color:var(--inchiostro);min-height:100vh;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  h1{font-family:'Space Grotesk';font-size:22px;margin-bottom:6px;}
  .sub{color:var(--grigio);font-size:14px;margin-bottom:28px;}

  /* SCHERMATA PASSWORD */
  #schermata-login{max-width:360px;margin:80px auto;padding:0 20px;text-align:center;}
  #schermata-login input{
    width:100%;padding:14px;border:1px solid #B4B2A9;border-radius:8px;
    font-size:16px;margin-bottom:14px;box-sizing:border-box;text-align:center;
  }
  #schermata-login button, .btn-salva{
    width:100%;padding:14px;background:var(--giallo);color:var(--blu-profondo-2);
    border:none;border-radius:100px;font-size:15px;font-weight:600;cursor:pointer;
  }
  #errore-login{color:#C0392B;font-size:13px;margin-top:10px;min-height:18px;}

  /* PANNELLO */
  #pannello{display:none;max-width:560px;margin:40px auto;padding:0 20px 60px;}
  .sezione{background:var(--bianco);border-radius:14px;padding:22px 24px;margin-bottom:20px;border:1px solid rgba(22,35,43,0.08);}
  .sezione h2{font-size:15px;font-family:'IBM Plex Mono';text-transform:uppercase;letter-spacing:0.05em;color:var(--blu-acqua);margin-bottom:16px;}
  .riga{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid rgba(22,35,43,0.06);}
  .riga:last-child{border-bottom:none;}
  .riga-nome{font-size:14.5px;}
  .riga-nome small{display:block;color:var(--grigio);font-size:12px;}
  .riga input{
    width:100px;padding:8px 10px;border:1px solid #B4B2A9;border-radius:6px;
    font-size:14.5px;text-align:right;font-family:'IBM Plex Mono';
  }
  .riga input.minuti{width:70px;}
  .campo-doppio{display:flex;gap:8px;align-items:center;}
  #messaggio-salvataggio{text-align:center;font-size:14px;margin-top:16px;min-height:20px;}
  .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .logout{font-size:12.5px;color:var(--grigio);text-decoration:underline;cursor:pointer;background:none;border:none;}
</style>
</head>
<body>

<div id="schermata-login">
  <h1 style="margin-top:80px;">Area riservata</h1>
  <p class="sub">L'Orsetto Lavatore — solo per il titolare</p>
  <input type="password" id="input-password" placeholder="Password" autofocus>
  <button id="btn-accedi">Accedi</button>
  <div id="errore-login"></div>
</div>

<div id="pannello">
  <div class="top-bar">
    <div>
      <h1>Modifica prezzi</h1>
      <p class="sub">Le modifiche compaiono subito sul sito pubblico</p>
    </div>
    <button class="logout" id="btn-esci">Esci</button>
  </div>

  <div class="sezione">
    <h2>Lavatrici</h2>
    <div id="lista-lavatrici"><!-- generato via JS --></div>
  </div>

  <div class="sezione">
    <h2>Asciugatrici</h2>
    <div class="riga">
      <div class="riga-nome">Tempo e prezzo per ogni asciugatrice<small>si applica a tutte e 4</small></div>
      <div class="campo-doppio">
        <input type="number" id="asciugatrici-minuti" class="minuti" min="1" step="1"> min
        <input type="number" id="asciugatrici-prezzo" min="0" step="0.10"> €
      </div>
    </div>
  </div>

  <div class="sezione">
    <h2>Sottovuoto</h2>
    <div class="riga">
      <div class="riga-nome">Sacchetto per sottovuoto piumoni</div>
      <input type="number" id="sottovuoto-prezzo" min="0" step="0.10">
    </div>
  </div>

  <button class="btn-salva" id="btn-salva">Salva modifiche</button>
  <div id="messaggio-salvataggio"></div>
</div>

<script>
/* Stesso indirizzo server usato dal sito principale */
const URL_SERVER_BASE = "https://orsetto-lavatore-server.onrender.com";
const URL_LISTINO = URL_SERVER_BASE + "/api/listino";

let passwordInserita = "";
let listinoAttuale = null;

function euroInput(v){ return Number(v).toFixed(2); }

async function caricaListino(){
  const risposta = await fetch(URL_LISTINO);
  listinoAttuale = await risposta.json();

  document.getElementById("lista-lavatrici").innerHTML = listinoAttuale.lavatrici.map((m, i) => `
    <div class="riga">
      <div class="riga-nome">${m.nome}<small>nome non modificabile, agganciato all'Arduino</small></div>
      <input type="number" min="0" step="0.10" data-index="${i}" class="prezzo-lavatrice" value="${euroInput(m.prezzo)}">
    </div>
  `).join("");

  document.getElementById("asciugatrici-minuti").value = listinoAttuale.asciugatrici.minuti;
  document.getElementById("asciugatrici-prezzo").value = euroInput(listinoAttuale.asciugatrici.prezzo);
  document.getElementById("sottovuoto-prezzo").value = euroInput(listinoAttuale.sacchettoSottovuoto);
}

document.getElementById("btn-accedi").addEventListener("click", async () => {
  const pwd = document.getElementById("input-password").value;
  const errore = document.getElementById("errore-login");
  errore.textContent = "";
  try {
    await caricaListino();
    // Verifica subito la password riscrivendo gli stessi dati appena letti
    // (non cambia nulla, serve solo a controllare che la password sia giusta)
    const verifica = await fetch(URL_LISTINO, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Password": pwd },
      body: JSON.stringify(listinoAttuale)
    });
    if (verifica.status === 401) {
      errore.textContent = "Password errata.";
      return;
    }
    if (!verifica.ok) throw new Error();
    passwordInserita = pwd;
    document.getElementById("schermata-login").style.display = "none";
    document.getElementById("pannello").style.display = "block";
  } catch (e) {
    errore.textContent = "Non riesco a contattare il server. Riprova tra poco.";
  }
});

document.getElementById("input-password").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("btn-accedi").click();
});

document.getElementById("btn-esci").addEventListener("click", () => {
  document.getElementById("pannello").style.display = "none";
  document.getElementById("schermata-login").style.display = "block";
  document.getElementById("input-password").value = "";
});

document.getElementById("btn-salva").addEventListener("click", async () => {
  const msg = document.getElementById("messaggio-salvataggio");
  msg.style.color = "var(--grigio)";
  msg.textContent = "Salvataggio in corso...";

  document.querySelectorAll(".prezzo-lavatrice").forEach(input => {
    const i = Number(input.dataset.index);
    listinoAttuale.lavatrici[i].prezzo = Number(input.value);
  });
  listinoAttuale.asciugatrici.minuti = Number(document.getElementById("asciugatrici-minuti").value);
  listinoAttuale.asciugatrici.prezzo = Number(document.getElementById("asciugatrici-prezzo").value);
  listinoAttuale.sacchettoSottovuoto = Number(document.getElementById("sottovuoto-prezzo").value);

  try {
    const risposta = await fetch(URL_LISTINO, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Password": passwordInserita },
      body: JSON.stringify(listinoAttuale)
    });
    if (risposta.status === 401) {
      msg.style.color = "#C0392B";
      msg.textContent = "Password errata. Esci e riprova ad accedere.";
      return;
    }
    if (!risposta.ok) throw new Error();
    msg.style.color = "#3D7A4D";
    msg.textContent = "Salvato! Le modifiche sono già visibili sul sito.";
  } catch (e) {
    msg.style.color = "#C0392B";
    msg.textContent = "Errore di connessione, riprova.";
  }
});
</script>
</body>
</html>
